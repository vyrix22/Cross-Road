<!DOCTYPE html>
<html lang="en">

<head>
  <title>Crossy Road 3D - High-Res Voxel Edition</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description"
    content="Crossy Road 3D web game with rich voxel graphics, authentic character models, diverse vehicles, particle effects, and dynamic arcade sound." />
  <link rel="stylesheet" href="style.css?v=11" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐔</text></svg>" />
</head>

<body>
  <!-- Game UI Overlay -->
  <div id="ui-overlay">
    <!-- Top Header -->
    <div id="top-bar">
      <div class="stats-group">
        <div class="hud-pill coins">
          <span class="icon">🟡</span>
          <span id="coins-counter">0</span>
        </div>
        <div class="hud-pill timer" id="timer-pill" title="Time Remaining">
          <span class="icon">⏱️</span>
          <span id="timer-counter">60</span><span class="timer-unit">s</span>
        </div>
      </div>

      <div id="counter-container">
        <div id="counter">0</div>
      </div>

      <div class="top-actions">
        <button id="sound-btn" class="icon-btn" title="Toggle Sound">🔊</button>
      </div>
    </div>

    <!-- Tutorial / First Move Hint -->
    <div id="tutorial-hint">
      <span>Use WASD, Arrow Keys, or Tap to Hop!</span>
    </div>

    <!-- Touch / Click Controls -->
    <div id="controlls">
      <div class="d-pad">
        <button id="forward" aria-label="Forward">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <path d="M12 4l-8 8h5v8h6v-8h5z" />
          </svg>
        </button>
        <button id="left" aria-label="Left">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <path d="M4 12l8-8v5h8v6h-8v5z" />
          </svg>
        </button>
        <button id="backward" aria-label="Backward">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <path d="M12 20l8-8h-5v-8h-6v8h-5z" />
          </svg>
        </button>
        <button id="right" aria-label="Right">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <path d="M20 12l-8 8v-5h-8v-6h8v-5z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="end">
    <div class="modal-card">
      <div class="game-over-title" id="game-over-title">GAME OVER!</div>
      <div class="score-stats">
        <div class="stat-item">
          <span class="stat-label">Score</span>
          <span id="final-score" class="stat-val">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Coins</span>
          <span id="final-coins" class="stat-val gold">0</span>
        </div>
      </div>

      <button id="retry">PLAY AGAIN</button>
      <div class="retry-hint">[ Press Space or Enter to Retry ]</div>
    </div>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Main Game Script -->
  <script src="script.js?v=16"></script>
</body>

</html>
